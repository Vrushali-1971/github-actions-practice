name: Hosted Runners

on:
  push:

jobs: 
  ubuntu-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print details
        run: |
          echo "Running on Ubuntu"
          hostname
          whoami
      
  windows-job:
    runs-on: windows-latest
    steps:
      - name: Print details
        run: |
          echo "Running on Windows"
          hostname
          whoami

  macos-job:
    runs-on: macos-latest
    steps:
      - name: Print details
        run: |
          echo "Running on macOS"
          hostname
          whoami
              
